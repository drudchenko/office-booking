name: End-to-End Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built here rather than by Testcontainers so that the layer cache survives between runs.
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: office-booking:e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E Tests
        run: ./gradlew e2eTest -Pe2eImage=office-booking:e2e --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: build/reports/tests/e2eTest
          retention-days: 7
